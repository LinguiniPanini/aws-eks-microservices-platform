apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifier
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notifier
  template:
    metadata:
      labels:
        app: notifier
    spec:
      containers:
        - name: notifier
          image: linguinipanini/examen2-notifier:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: examen2-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: notifier
spec:
  type: ClusterIP
  selector:
    app: notifier
  ports:
    - port: 8080
      targetPort: 8080
