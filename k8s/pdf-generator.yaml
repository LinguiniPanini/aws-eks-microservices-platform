apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdf-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pdf-generator
  template:
    metadata:
      labels:
        app: pdf-generator
    spec:
      containers:
        - name: pdf-generator
          image: linguinipanini/examen2-pdf-generator:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: examen2-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: pdf-generator
spec:
  type: ClusterIP
  selector:
    app: pdf-generator
  ports:
    - port: 8080
      targetPort: 8080
